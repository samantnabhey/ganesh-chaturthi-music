<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणपती बाप्पा मोरया — Ganesh Chaturthi Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            transition: background 0.8s ease-in-out;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
            margin-bottom: 15px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .live-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .player-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .track-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .track-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            min-height: 24px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .track-artist {
            font-size: 13px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 28px;
            transition: transform 0.2s;
            padding: 8px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        button:hover {
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .play-btn {
            background: linear-gradient(135deg, #FF6B35 0%, #D32F2F 100%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 20px rgba(211, 47, 47, 0.4);
            transition: all 0.3s;
        }

        .play-btn:hover {
            box-shadow: 0 12px 30px rgba(211, 47, 47, 0.5);
            transform: scale(1.08);
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .seek-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }

        .seek-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #D32F2F);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px rgba(211, 47, 47, 0.5);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.9;
            margin-top: 8px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .playlist-link {
            display: block;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn-secondary {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }

        .support-section {
            text-align: center;
            margin-top: 20px;
        }

        .btn-support {
            display: inline-block;
            background: linear-gradient(135deg, #FFC107 0%, #FF9800 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-support:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4);
        }

        .footer {
            text-align: center;
            font-size: 11px;
            opacity: 0.8;
            margin-top: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .footer a {
            color: #FFC107;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        #youtube-player {
            display: none;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 26px;
            }

            .player-card {
                padding: 20px 15px;
            }

            .play-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .track-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="background-container" id="bg-container"></div>
    <div class="background-overlay"></div>

    <div class="container">
        <div class="header">
            <h1>गणपती बाप्पा मोरया</h1>
            <p>Ganesh Chaturthi Music</p>
            <div class="live-count">
                <span class="live-dot"></span>
                <span id="listener-count">1,234</span> celebrating
            </div>
        </div>

        <div class="player-card">
            <div class="track-info">
                <div class="track-title" id="track-title">Now Playing...</div>
                <div class="track-artist" id="track-artist">Ganesh Chaturthi Playlist</div>
            </div>

            <div class="player-controls">
                <button id="prev-btn" title="Previous">⏮️</button>
                <button class="play-btn" id="play-btn" title="Play/Pause">▶️</button>
                <button id="next-btn" title="Next">⏭️</button>
            </div>

            <div class="progress-container">
                <div class="seek-bar" id="seek-bar">
                    <div class="seek-fill" id="seek-fill"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="playlist-link">
                <a href="https://music.youtube.com/playlist?list=PLzlNlQTagdFDqpZH9Zx7eIKYa4V3GLZrL" target="_blank" class="btn-secondary">
                    ▶️ Play on YouTube Music
                </a>
            </div>

            <div class="support-section">
                <a href="https://buymeacoffee.com" target="_blank" class="btn-support">☕ Support This Project</a>
            </div>
        </div>

        <div class="footer">
            made with ❤️ for Ganesh Chaturthi | <a href="#">Your Website</a>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        const PLAYLIST_ID = 'PLzlNlQTagdFDqpZH9Zx7eIKYa4V3GLZrL';

        const BACKGROUNDS = [
            'linear-gradient(135deg, #FF6B35 0%, #D32F2F 100%)',
            'linear-gradient(135deg, #FFC107 0%, #FF9800 100%)',
            'linear-gradient(135deg, #D32F2F 0%, #FF6B35 50%, #FFC107 100%)',
            'linear-gradient(135deg, #FF9800 0%, #D32F2F 100%)',
            'linear-gradient(135deg, #FFC107 0%, #FF6B35 100%)',
            'linear-gradient(45deg, #D32F2F 0%, #FFC107 100%)',
            'linear-gradient(180deg, #FF6B35 0%, #D32F2F 100%)',
            'linear-gradient(90deg, #FFC107 0%, #FF6B35 100%)',
            'linear-gradient(135deg, #FF6B35 0%, #FFC107 50%, #D32F2F 100%)',
            'linear-gradient(45deg, #FFC107 0%, #FF9800 100%)',
        ];

        let player;
        let isPlaying = false;
        let updateInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: '',
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            player.loadPlaylist({
                list: PLAYLIST_ID,
                index: 0,
                startSeconds: 0
            });
            player.playVideo();
            changeBackground();
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('play-btn');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playBtn.textContent = '⏸️';
                startProgressUpdate();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playBtn.textContent = '▶️';
                clearInterval(updateInterval);
            } else if (event.data === YT.PlayerState.ENDED) {
                changeBackground();
            }
        }

        function onPlayerError(event) {
            console.error('YouTube Player Error:', event.data);
        }

        function changeBackground() {
            const randomBg = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
            document.getElementById('bg-container').style.background = randomBg;
        }

        document.getElementById('play-btn').addEventListener('click', () => {
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            player.nextVideo();
            changeBackground();
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            player.previousVideo();
            changeBackground();
        });

        document.getElementById('seek-bar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            player.seekTo(percent * player.getDuration());
        });

        function startProgressUpdate() {
            clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                if (duration > 0) {
                    const percent = (current / duration) * 100;
                    document.getElementById('seek-fill').style.width = percent + '%';
                    document.getElementById('current-time').textContent = formatTime(current);
                    document.getElementById('duration').textContent = formatTime(duration);
                }
            }, 500);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateListenerCount() {
            const baseCount = 1234;
            const variance = Math.floor(Math.random() * 500) - 250;
            const count = Math.max(baseCount + variance, 100);
            document.getElementById('listener-count').textContent = count.toLocaleString();
        }

        setInterval(updateListenerCount, 5000);

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        changeBackground();
    </script>
</body>
</html>
