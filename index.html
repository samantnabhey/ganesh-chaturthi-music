<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणपती बाप्पा मोरया — Ganesh Chaturthi Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .background-overlay {
            opacity: 1;
        }


        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 15px 20px;
            z-index: 10;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.3));
            height: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 32px;
            transition: transform 0.2s, filter 0.2s;
            padding: 0;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        button:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        button:active {
            transform: scale(0.95);
        }

        .play-btn {
            background: linear-gradient(135deg, #FF6B35 0%, #D32F2F 100%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.5);
        }

        .play-btn:hover {
            box-shadow: 0 15px 40px rgba(211, 47, 47, 0.7);
        }

        .progress-bar-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .seek-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            overflow: hidden;
        }

        .seek-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #D32F2F);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 6px rgba(211, 47, 47, 0.8);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            opacity: 0.8;
            margin-top: 6px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        #youtube-player {
            display: none;
        }

        @media (max-width: 480px) {
            .player-controls {
                gap: 20px;
            }

            .play-btn {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            button {
                font-size: 24px;
            }

            .header h1 {
                font-size: 22px;
            }

            .player-container {
                padding: 30px 20px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-container" id="bg-container">
        <video id="bg-video" autoplay muted loop playsinline>
            <source id="video-source" src="" type="video/mp4">
        </video>
    </div>
    <div class="background-overlay"></div>


    <div class="player-container">
        <div class="progress-bar-container">
            <div class="seek-bar" id="seek-bar">
                <div class="seek-fill" id="seek-fill"></div>
            </div>
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-controls">
            <button id="prev-btn" title="Previous">⏮️</button>
            <button class="play-btn" id="play-btn" title="Play/Pause">▶️</button>
            <button id="next-btn" title="Next">⏭️</button>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        const PLAYLIST_ID = 'PLzlNlQTagdFDqpZH9Zx7eIKYa4V3GLZrL';

        const VIDEOS = [
            'https://res.cloudinary.com/gudkbcir/video/upload/v1787906440/Ganesh_ji.mp4',
        ];

        let player;
        let isPlaying = false;
        let updateInterval;
        let currentVideoIndex = 0;
        let autoAdvanceGuard;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: '',
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            player.loadPlaylist({
                list: PLAYLIST_ID,
                index: 0,
                startSeconds: 0
            });
            setTimeout(() => {
                player.playVideo();
                changeBackground();
            }, 500);
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('play-btn');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playBtn.textContent = '⏸️';
                currentVideoIndex = player.getPlaylistIndex();
                startProgressUpdate();
                startAutoAdvanceGuard();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playBtn.textContent = '▶️';
                clearInterval(updateInterval);
                clearInterval(autoAdvanceGuard);
            } else if (event.data === YT.PlayerState.ENDED) {
                changeBackground();
                isPlaying = false;
                playBtn.textContent = '▶️';
                clearInterval(updateInterval);
                clearInterval(autoAdvanceGuard);
                document.getElementById('seek-fill').style.width = '0%';
                document.getElementById('current-time').textContent = '0:00';
                player.pauseVideo();
            }
        }

        function onPlayerError(event) {
            console.error('Player error:', event.data);
        }

        function changeBackground() {
            const randomVideo = VIDEOS[Math.floor(Math.random() * VIDEOS.length)];
            const videoSource = document.getElementById('video-source');
            videoSource.src = randomVideo;
            const video = document.getElementById('bg-video');
            video.load();
            video.play();
        }

        document.getElementById('play-btn').addEventListener('click', () => {
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            player.nextVideo();
            changeBackground();
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            player.previousVideo();
            changeBackground();
        });

        document.getElementById('seek-bar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            player.seekTo(percent * player.getDuration());
        });

        function startProgressUpdate() {
            clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                if (duration > 0) {
                    const percent = (current / duration) * 100;
                    document.getElementById('seek-fill').style.width = percent + '%';
                    document.getElementById('current-time').textContent = formatTime(current);
                    document.getElementById('duration').textContent = formatTime(duration);
                }
            }, 500);
        }

        function startAutoAdvanceGuard() {
            clearInterval(autoAdvanceGuard);
            autoAdvanceGuard = setInterval(() => {
                const newIndex = player.getPlaylistIndex();
                if (newIndex !== currentVideoIndex) {
                    player.pauseVideo();
                    clearInterval(autoAdvanceGuard);
                }
            }, 100);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateListenerCount() {
            const baseCount = 1234;
            const variance = Math.floor(Math.random() * 500) - 250;
            const count = Math.max(baseCount + variance, 100);
            document.getElementById('listener-count').textContent = count.toLocaleString();
        }

        setInterval(updateListenerCount, 5000);

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        changeBackground();
    </script>
</body>
</html>
