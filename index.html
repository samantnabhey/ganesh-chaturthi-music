<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणपती बाप्पा मोरया — Ganesh Chaturthi Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #D32F2F 50%, #FFC107 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero {
            background: linear-gradient(135deg, #FF6B35 0%, #D32F2F 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '🙏';
            position: absolute;
            font-size: 120px;
            opacity: 0.1;
            top: -20px;
            right: -20px;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .hero p {
            font-size: 14px;
            opacity: 0.95;
            margin-bottom: 20px;
        }

        .live-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .player-section {
            padding: 30px 20px;
        }

        .track-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .track-title {
            font-size: 18px;
            font-weight: 600;
            color: #D32F2F;
            margin-bottom: 8px;
            min-height: 24px;
        }

        .track-artist {
            font-size: 13px;
            color: #666;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 28px;
            transition: transform 0.2s;
            padding: 8px;
        }

        button:hover {
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .play-btn {
            background: linear-gradient(135deg, #FF6B35 0%, #D32F2F 100%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
            transition: all 0.3s;
        }

        .play-btn:hover {
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
            transform: scale(1.05);
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .seek-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }

        .seek-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #D32F2F);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .playlist-link {
            display: block;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn-secondary {
            display: inline-block;
            background: #f5f5f5;
            color: #D32F2F;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid #D32F2F;
        }

        .btn-secondary:hover {
            background: #D32F2F;
            color: white;
        }

        .support-section {
            border-top: 1px solid #e0e0e0;
            padding: 20px;
            text-align: center;
        }

        .btn-support {
            display: block;
            background: linear-gradient(135deg, #FFC107 0%, #FF9800 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-support:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.3);
        }

        .footer {
            padding: 15px 20px;
            text-align: center;
            background: #f9f9f9;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #e0e0e0;
        }

        .footer a {
            color: #D32F2F;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Hidden YouTube player */
        #youtube-player {
            display: none;
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 24px;
            }

            .player-section {
                padding: 20px 15px;
            }

            .track-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>गणपती बाप्पा मोरया</h1>
            <p>Ganesh Chaturthi Music</p>
            <div class="live-count">
                <span class="live-dot"></span>
                <span id="listener-count">1,234</span> celebrating
            </div>
        </div>

        <div class="player-section">
            <div class="track-info">
                <div class="track-title" id="track-title">Loading...</div>
                <div class="track-artist" id="track-artist">Ganesh Chaturthi Playlist</div>
            </div>

            <div class="player-controls">
                <button id="prev-btn" title="Previous">⏮️</button>
                <button class="play-btn" id="play-btn" title="Play/Pause">▶️</button>
                <button id="next-btn" title="Next">⏭️</button>
            </div>

            <div class="progress-container">
                <div class="seek-bar" id="seek-bar">
                    <div class="seek-fill" id="seek-fill"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="playlist-link">
                <a href="https://music.youtube.com/playlist?list=PLgObA3pAqvOh87Z03QG8Z4xE-uqlAWSBy" target="_blank" class="btn-secondary">
                    Open Playlist on YouTube Music →
                </a>
            </div>
        </div>

        <div class="support-section">
            <a href="https://buymeacoffee.com" target="_blank" class="btn-support">☕ Support This Project</a>
        </div>

        <div class="footer">
            made with ❤️ by You | <a href="#">Your Website</a>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        const PLAYLIST_ID = 'PLgObA3pAqvOh87Z03QG8Z4xE-uqlAWSBy'; // Replace with your Ganesh Chaturthi playlist ID
        let player;
        let isPlaying = false;
        let updateInterval;

        // Initialize YouTube API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: '',
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            console.log('Player ready');
            // Load playlist
            player.loadPlaylist({
                list: PLAYLIST_ID,
                index: 0,
                startSeconds: 0
            });
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('play-btn');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playBtn.textContent = '⏸️';
                startProgressUpdate();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playBtn.textContent = '▶️';
                clearInterval(updateInterval);
            } else if (event.data === YT.PlayerState.ENDED) {
                playBtn.textContent = '▶️';
            }
            updateTrackInfo();
        }

        function onPlayerError(event) {
            console.error('Player error:', event.data);
        }

        // UI Controls
        document.getElementById('play-btn').addEventListener('click', () => {
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            player.nextVideo();
            setTimeout(updateTrackInfo, 500);
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            player.previousVideo();
            setTimeout(updateTrackInfo, 500);
        });

        document.getElementById('seek-bar').addEventListener('click', (e) => {
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            player.seekTo(percent * duration);
        });

        function startProgressUpdate() {
            clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                const current = player.getCurrentTime();
                const duration = player.getDuration();

                if (duration > 0) {
                    const percent = (current / duration) * 100;
                    document.getElementById('seek-fill').style.width = percent + '%';
                    document.getElementById('current-time').textContent = formatTime(current);
                    document.getElementById('duration').textContent = formatTime(duration);
                }
            }, 500);
        }

        function updateTrackInfo() {
            // Try to get playlist data
            const title = `Now Playing...`;
            document.getElementById('track-title').textContent = title;
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Simulate live listener count
        function updateListenerCount() {
            const baseCount = 1234;
            const variance = Math.floor(Math.random() * 500) - 250;
            const count = Math.max(baseCount + variance, 100);
            document.getElementById('listener-count').textContent = count.toLocaleString();
        }

        setInterval(updateListenerCount, 5000);

        // Load YouTube API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        // Initialize on load
        window.addEventListener('load', () => {
            setTimeout(updateTrackInfo, 1000);
        });
    </script>
</body>
</html>
