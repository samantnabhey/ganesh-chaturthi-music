<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणपती बाप्पा मोरया — Ganesh Chaturthi Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .spotify-embed {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .spotify-embed iframe {
            width: 100%;
            height: 380px;
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .spotify-embed iframe {
                height: 300px;
            }
        }

        @media (max-width: 480px) {
            .spotify-embed iframe {
                height: 250px;
            }

            .player-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="background-container" id="bg-container">
        <video id="bg-video" autoplay muted loop playsinline>
            <source id="video-source" src="https://res.cloudinary.com/gudkbcir/video/upload/v1787906440/Ganesh_ji.mp4" type="video/mp4">
        </video>
    </div>
    <div class="background-overlay"></div>

    <div class="player-container">
        <div class="spotify-embed">
            <iframe src="https://open.spotify.com/embed/playlist/0xCJotRpAh6bUTPj8a7uFq?utm_source=generator" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

</body>
</html>
